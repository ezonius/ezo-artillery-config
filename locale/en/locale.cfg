[mod-setting-description]
ezo-artillery-config-range-multiplier=Multiplies the firing range of every artillery turret and artillery wagon (vanilla and modded). The automatic targeting range scales by this multiplier, and since the manual-fire range is the automatic range multiplied by the manual range modifier (vanilla modifier: 2.5, unchanged), the manual range scales by the same multiplier (e.g. ×3 setting = automatic 224×3=672, manual 560×3=1680). __CONTROL_TAB__min_range__CONTROL_END__ is scaled separately by the minimum range multiplier. 1 = vanilla. Applied at startup; changing it requires a game restart.
ezo-artillery-config-gun-cooldown-multiplier=Multiplies the cooldown between shots (shooting speed) of every artillery turret and artillery wagon's gun. Higher = slower firing, lower = faster firing. 1 = vanilla. Applied at startup; changing it requires a game restart.
ezo-artillery-config-turret-rotation-multiplier=Multiplies the turret rotation speed of every artillery turret and artillery wagon. Higher = the barrel tracks targets faster. 1 = vanilla. Applied at startup; changing it requires a game restart.
ezo-artillery-config-shell-damage-multiplier=Multiplies the damage dealt by every artillery shell projectile (discovered via each artillery gun's trigger chain, so modded shells are included too). 1 = vanilla. Applied at startup; changing it requires a game restart.
ezo-artillery-config-splash-radius-multiplier=Multiplies the explosion/area radius effects attached to every artillery shell projectile (discovered via each artillery gun's trigger chain, so modded shells are included too). 1 = vanilla. Applied at startup; changing it requires a game restart.
ezo-artillery-config-min-range-multiplier=Multiplies the minimum firing range (__CONTROL_TAB__min_range__CONTROL_END__) of every artillery turret and artillery wagon (vanilla and modded). Higher values push targets further out from the artillery piece; artillery never fires at targets closer than this distance. 1 = vanilla. Applied at startup; changing it requires a game restart.
